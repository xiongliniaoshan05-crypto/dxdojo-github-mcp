<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>水曜のDX道場 — GitHub MCP ハンズオン</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background:
        radial-gradient(circle at 15% 20%, #f9a8d4 0, transparent 32%),
        radial-gradient(circle at 85% 15%, #a5b4fc 0, transparent 30%),
        radial-gradient(circle at 80% 85%, #67e8f9 0, transparent 34%),
        linear-gradient(135deg, #312e81, #7e22ce 48%, #be185d);
      color: #fff;
    }

    .card {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 24px 60px rgba(49, 46, 129, 0.35);
      backdrop-filter: blur(12px);
    }

    .label {
      color: #7c3aed;
      font-weight: 700;
    }

    h1, h2 {
      color: #312e81;
    }

    .lead {
      color: #475569;
    }

    .edit-me {
      background: linear-gradient(135deg, #ede9fe, #fce7f3);
      border: 1px solid #c4b5fd;
      color: #4338ca;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    #message {
      color: #be185d;
      font-weight: 700;
    }

    code {
      background: #e0e7ff;
      color: #4338ca;
    }

    footer {
      color: #64748b;
    }

    .badge {
      background: linear-gradient(135deg, #7c3aed, #db2777);
      color: #fff;
      border-radius: 999px;
      padding: 0.2em 0.7em;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="label">水曜のDX道場</p>
    <h1>GitHub MCP ハンズオン</h1>
    <p class="lead">
      このページは <strong>GitHub Actions</strong> によって自動デプロイされています。<br>
      <code>main</code> ブランチに push されると、数十秒後にこのページが更新されます。
    </p>

    <!-- ▼▼▼ ハンズオンではここを編集します ▼▼▼ -->
    <section class="edit-me">
      <h2>参加者メッセージ</h2>
      <p id="message">Hello Github MCP〜</p>
    </section>
    <!-- ▲▲▲ ハンズオンではここを編集します ▲▲▲ -->

    <footer>
      <p>デプロイ回数: <span class="badge">v1</span></p>
    </footer>
  </main>
</body>
</html>
